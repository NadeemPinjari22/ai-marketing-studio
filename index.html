<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Marketing Studio</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      color: #111827;
    }

    header {
      background: white;
      padding: 18px 6%;
      border-bottom: 1px solid #e5e7eb;
    }

    .logo {
      font-size: 22px;
      font-weight: bold;
    }

    main {
      max-width: 900px;
      margin: 40px auto;
      padding: 20px;
    }

    .hero {
      background: white;
      padding: 35px;
      border-radius: 20px;
      text-align: center;
      box-shadow: 0 5px 25px rgba(0,0,0,0.06);
    }

    h1 {
      font-size: 34px;
      margin-bottom: 12px;
    }

    p {
      color: #6b7280;
      margin-bottom: 25px;
    }

    .upload {
      border: 2px dashed #9ca3af;
      border-radius: 16px;
      padding: 35px 20px;
      margin: 20px 0;
    }

    input {
      margin-top: 15px;
    }

    .options {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      margin-top: 20px;
    }

    button {
      padding: 14px;
      border: 0;
      border-radius: 10px;
      background: #111827;
      color: white;
      font-size: 15px;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.9;
    }

    #status {
      margin-top: 20px;
      font-weight: bold;
    }

    @media (max-width: 600px) {
      h1 {
        font-size: 27px;
      }

      .options {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

  <header>
    <div class="logo">AI Marketing Studio</div>
  </header>

  <main>
    <section class="hero">

      <h1>1 Photo → Complete Marketing</h1>

      <p>
        Upload your shop or product photo and create
        professional marketing content.
      </p>
